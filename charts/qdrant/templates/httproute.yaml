{{- $httproute := (.Values.httproute | default dict) }}
{{- if ($httproute.enabled | default false) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qdrant
spec:
  parentRefs:
    - name: {{ $httproute.gateway_name | default "istio-gateway" }}
      namespace: {{ $httproute.gateway_namespace | default "istio-ingress" }}
      sectionName: https
  hostnames:
    - {{ $httproute.host | quote }}
  rules:
    - backendRefs:
        # The qdrant chart names its Service "qdrant" (no release prefix), so
        # the backend must not be templated with .Release.Name.
        - name: qdrant
          port: 6333
{{- end }}
